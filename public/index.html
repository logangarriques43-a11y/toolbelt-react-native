<!DOCTYPE html>
<!--
  HTML shell for the browser build (app.toolbelt.tools). Expo uses this file
  for the single-page web export (app.json → web.output "single"); the phone
  apps never load it.
  - Home-screen install: manifest + apple-touch-icon + standalone display.
  - Mid-size windows (641–1023px) show the phone layout, and its modal
    sheets, in a centered 640px column.
  - Computers (1024px and wider) get the desktop layout: a sidebar beside the
    screens (components/desktop-shell.web.tsx), and sheets presented as
    centered panels (components/web/modal-frame.ts tags them).
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>ToolBelt</title>
    <meta name="description" content="Run your business from one place: bookings, clients, invoices, staff and AI texting." />
    <meta name="theme-color" content="#3A5240" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="ToolBelt" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="format-detection" content="telephone=no" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/png" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <style id="expo-reset">
      /* react-native-web root setup: full-height body, ScrollView-driven scrolling. */
      html, body { height: 100%; }
      body { overflow: hidden; margin: 0; background: #ECEDE6; overscroll-behavior: none; }
      #root { display: flex; height: 100%; flex: 1; }
      @media (prefers-color-scheme: dark) { body { background: #0E100E; } }

      /* Row delete button (components/hover-delete.web.tsx): show on hover / keyboard focus, never on touch-only screens. */
      [data-hover-delete-btn] { opacity: 0; transition: opacity 0.15s ease; }
      [data-hover-delete]:hover [data-hover-delete-btn], [data-hover-delete-btn]:focus-visible { opacity: 1; }
      @media (hover: none) { [data-hover-delete-btn] { display: none !important; } }

      /* Keyboard focus ring in the app's sage instead of the browser default. */
      input:focus-visible, textarea:focus-visible, [tabindex]:focus-visible { outline: 2px solid #8FB996; outline-offset: 1px; }

      /* Mid-size windows: the phone layout in a centered column, modal sheets aligned to it. */
      @media (min-width: 641px) and (max-width: 1023px) {
        body { background: #DCDED6; }
        #root, body > div:not(#root) {
          max-width: 640px;
          margin-left: auto !important;
          margin-right: auto !important;
          left: 0 !important;
          right: 0 !important;
        }
        #root { box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.06), 0 12px 48px rgba(0, 0, 0, 0.12); }
        /* react-native-web Modals render a fixed, full-window layer inside a body-level portal; pin it to the column. */
        body > div:not(#root) > div[style*="fixed"], body > div:not(#root) > div {
          left: calc(50% - 320px) !important;
          right: calc(50% - 320px) !important;
        }
      }
      @media (min-width: 641px) and (max-width: 1023px) and (prefers-color-scheme: dark) {
        body { background: #0A0B0A; }
        #root { box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.06), 0 12px 48px rgba(0, 0, 0, 0.5); }
      }

      /* Computers: the app fills the window (sidebar layout); sheets open centered. */
      @media (min-width: 1024px) {
        /* The modal's portal covers the window so clicks beside a sheet never reach the page under it. */
        body > div:not(#root):has(> [data-tb-modal]) { position: fixed; inset: 0; z-index: 9998; }
        /* Full-screen forms: a centered rounded panel over a dimmed window. */
        [data-tb-modal="panel"] {
          top: max(24px, 4vh) !important;
          bottom: max(24px, 4vh) !important;
          left: calc(50% - 320px) !important;
          right: calc(50% - 320px) !important;
          border-radius: 18px;
          overflow: hidden;
          box-shadow: 0 0 0 100vmax rgba(0, 0, 0, 0.4), 0 24px 64px rgba(0, 0, 0, 0.3);
        }
        /* Bottom sheets and menus: kept in a centered column; outside it is dimmed exactly like their own backdrop. */
        [data-tb-modal="overlay"] {
          left: calc(50% - 320px) !important;
          right: calc(50% - 320px) !important;
          box-shadow: 0 0 0 100vmax var(--tb-scrim, transparent);
        }
      }
      }
    </style>
  </head>
  <body>
    <noscript>ToolBelt needs JavaScript turned on to run in your browser.</noscript>
    <div id="root"></div>
  </body>
</html>
