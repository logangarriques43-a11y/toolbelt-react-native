name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    name: Typecheck + weed guards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Weed guards (ratchet)
        run: scripts/weed-ratchet.sh
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
